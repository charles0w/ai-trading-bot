# Daily ai-trading-bot run — serverless, no laptop required.
#
# Mirrors scripts/run_daily.sh (grade -> scan -> run_once -> report) on a
# GitHub-hosted runner, then commits data/predictions.jsonl back to main so
# the prediction log survives the ephemeral runner and every machine (Mac,
# Windows, weekly eval) reads one canonical history via git.
#
# SETUP (one-time, from any machine with gh auth):
#   1. Add the four secrets (values from your local .env — run these yourself):
#        gh secret set ALPACA_API_KEY
#        gh secret set ALPACA_SECRET_KEY
#        gh secret set FINNHUB_API_KEY
#        gh secret set ANTHROPIC_API_KEY
#      (each prompts for the value; paste from .env)
#   2. Test manually: Actions tab -> "daily-run" -> Run workflow.
#   3. When a few dry runs look right, uncomment the `schedule:` block below.
#   4. To place paper orders: repo Settings -> Variables -> ATB_EXECUTE = 1
#      (variable, not secret — mirrors the plist's ATB_EXECUTE convention).
#   5. Disable the Mac launchd job so there is exactly ONE canonical daily
#      writer:  launchctl unload ~/Library/LaunchAgents/com.charles.atb-daily.plist
#
# Schedule: 14:35 UTC = 7:35am PDT (6:35am PST — shifts with DST; adjust in
# November if the pre-market timing matters).

name: daily-run

on:
  workflow_dispatch: {}
  schedule:
    - cron: "35 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CEOS_REPORT_SECRET: ${{ secrets.CEOS_REPORT_SECRET }}
      ATB_EXECUTE: ${{ vars.ATB_EXECUTE || '0' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet alpaca-py anthropic finnhub-python yfinance \
            pandas python-dotenv

      - name: Guard — secrets present
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$FINNHUB_API_KEY" ]; then
            echo "::error::Repo secrets not configured — see setup notes in this file."
            exit 1
          fi

      - name: Grade matured predictions
        run: python scripts/grade.py

      - name: Scan for PEAD candidates
        run: python scripts/scan.py

      - name: Run the brain (dry run unless ATB_EXECUTE=1)
        run: |
          # --with-scan appends recent liquid reporters (the actual PEAD
          # candidates) to the default universe; without it the automation
          # only ever evaluates 9 mega-caps and misses the strategy.
          if [ "$ATB_EXECUTE" = "1" ]; then
            python scripts/run_once.py --with-scan --execute
          else
            python scripts/run_once.py --with-scan
          fi

      - name: Commit prediction log + chain snapshots back to main
        run: |
          git config user.name "atb-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/predictions.jsonl data/chain_snapshots.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No prediction/snapshot changes to commit."
          else
            git commit -m "daily-run: predictions + chain snapshots $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Mirror into the vault (obi-secondbrain)
        env:
          VAULT_DEPLOY_KEY: ${{ secrets.VAULT_DEPLOY_KEY }}
        run: |
          if [ -z "$VAULT_DEPLOY_KEY" ]; then echo "no VAULT_DEPLOY_KEY — skipping mirror"; exit 0; fi
          mkdir -p ~/.ssh
          # printf with trailing newline + CR strip: OpenSSH rejects PEM keys
          # with CRLF endings or a missing final newline ("error in libcrypto")
          printf '%s\n' "$VAULT_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/vault_key
          chmod 600 ~/.ssh/vault_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/vault_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:charles0w/obi-secondbrain.git /tmp/vault
          python scripts/vault_mirror.py /tmp/vault --mode daily
          cd /tmp/vault
          git config user.name "atb-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "vault already current"; exit 0; fi
          git commit -m "ai-trading-bot: mirror daily run $(date -u '+%Y-%m-%d')"
          # obsidian-git on the desktop may race us — rebase-retry, never force
          for i in 1 2 3; do
            git push origin main && break || git pull --rebase origin main
          done

      # Deliberately LAST and deliberately NOT `|| true`. Last, so a reporter
      # failure can never cost us the prediction/snapshot commit above (that
      # data is unrecoverable — chain snapshots cannot be backfilled). Not
      # swallowed, so a missing secret or a dashboard outage turns the run red
      # instead of exiting 0 with a silently stale feed, which is exactly how
      # this went unnoticed before 2026-08-13.
      - name: Report to ceos-enterprise dashboard
        run: python scripts/report.py
