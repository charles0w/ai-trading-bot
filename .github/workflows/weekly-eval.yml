# Weekly eval — serverless. Runs Monday 15:15 UTC (8:15am PDT), ~40 minutes
# after Monday's daily-run has graded matured predictions, so the scorecard
# includes the freshest grades. Commits evals/weekly-<date>.md + evals/latest.md
# back to main. The Windows `atb-weekly-eval` scheduled task mirrors these into
# the Obsidian vault whenever that machine is next open — reporting only; no
# device needs to be on for the eval itself.

name: weekly-eval

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 15 * * 1"

permissions:
  contents: write

concurrency:
  group: weekly-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet anthropic

      - name: Run weekly eval
        run: python scripts/weekly_eval.py

      - name: Commit eval back to main
        run: |
          git config user.name "atb-eval-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evals/
          if git diff --cached --quiet; then
            echo "No eval changes to commit."
          else
            git commit -m "weekly-eval: $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Mirror into the vault (obi-secondbrain)
        env:
          VAULT_DEPLOY_KEY: ${{ secrets.VAULT_DEPLOY_KEY }}
        run: |
          if [ -z "$VAULT_DEPLOY_KEY" ]; then echo "no VAULT_DEPLOY_KEY — skipping mirror"; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VAULT_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/vault_key
          chmod 600 ~/.ssh/vault_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/vault_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:charles0w/obi-secondbrain.git /tmp/vault
          python scripts/vault_mirror.py /tmp/vault --mode weekly
          cd /tmp/vault
          git config user.name "atb-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "vault already current"; exit 0; fi
          git commit -m "ai-trading-bot: mirror weekly eval $(date -u '+%Y-%m-%d')"
          for i in 1 2 3; do
            git push origin main && break || git pull --rebase origin main
          done
